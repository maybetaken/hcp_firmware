description: |
  WS2812-class addressable LEDs driven by an ESP32 RMT TX channel.

  Each data bit becomes one RMT symbol whose high time is the WS2812 phase
  (t0H 400 ns, t1H 800 ns of a 1250 ns bit), generated by the peripheral's own
  counter rather than by CPU timing. See ws2812_rmt.c for why that distinction is
  the reason this driver exists.

  Example:

    led_strip0: led-strip {
            compatible = "espressif,esp32-ws2812-rmt";
            data-gpios = <&gpio0 8 GPIO_ACTIVE_HIGH>;
            chain-length = <1>;
    };

compatible: "espressif,esp32-ws2812-rmt"

include: ws2812.yaml

properties:
  data-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO driving the strip's data line. It is configured as an output and then
      routed to through the GPIO matrix by the RMT signal of the chosen channel, so
      no pinmux table entry is needed - the pin number is free within the part's
      matrix.

  espressif,rmt-channel:
    type: int
    default: 0
    description: |
      RMT TX channel to use. This driver claims exactly one channel per DT instance
      and allocates none, so two strip nodes have to name different channels
      explicitly - and the channel must exist on the part (four on the ESP32-C3,
      fewer on some newer ones), which the binding cannot know.
