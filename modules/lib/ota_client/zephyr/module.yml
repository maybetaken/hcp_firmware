#
# ota_client: transport agnostic firmware update client for Zephyr.
#
# The module carries no board, application or vendor dependencies: an update is
# described by two small operation tables (a source of image bytes and a sink
# for them), so any transport (HTTP, CoAP, BLE, USB CDC, ...) can be combined
# with any bootloader backend (MCUboot, ...) without touching the core.

build:
  cmake: .
  kconfig: Kconfig
