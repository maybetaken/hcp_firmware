# MCUboot overlay for signed images: add this on top of mcuboot.conf with
# ./tools/build_mcuboot.sh --signed (it also passes the key file, whose path is
# specific to the container mount, so it is not repeated here).
#
# The trust anchor is baked into the bootloader, and the bootloader cannot be
# updated by an OTA - so changing key, or going from unsigned to signed, means
# reflashing mcuboot.bin on every device. See tools/mcuboot/README.md.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
