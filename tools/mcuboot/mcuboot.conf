# MCUboot build overlay, shared by the HCP boards.
#
# MCUboot is built as an ordinary Zephyr application out of
# ${ZEPHYR_BASE}/../bootloader/mcuboot/boot/zephyr (see tools/build_mcuboot.sh),
# so the slot geometry is not repeated here: it comes from each board's own
# devicetree, i.e. the same fixed-partitions the application links against. See
# tools/mcuboot/README.md for the per-board offsets.
#
# boot/zephyr/socs/<soc>.conf is applied before this file. On ESP32-C6/C3 that
# SoC fragment picks a single-image "upgrade only" flow, so the lines below are
# what turns it into the trial-swap behaviour the product needs.

# --- upgrade mode: exchange the two slots, keep the old image -----------------
# Overwrite-only has no way back: once the new image has been copied over the
# primary slot, a firmware that boots but never works is final. Move-based swap
# leaves the previous image in the other slot and only commits the exchange once
# the new image confirms itself (CONFIG_BOOT_VALIDATE_SLOT0 below).
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_SWAP_USING_MOVE=y
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n

# Treat an unconfirmed primary slot as a failed trial and swap back at the next
# reset. hcp::ota calls boot_write_img_confirmed() only once the device has an IP
# address *and* a live broker session, so "it started" alone never keeps a bad
# image.
CONFIG_BOOT_VALIDATE_SLOT0=y

# --- signature ----------------------------------------------------------------
# Bench bring-up: unsigned images, so the layout and the whole update path can be
# verified before key material is managed. This choice lives inside the bootloader,
# so moving to ECDSA-P256 later means re-flashing MCUboot on every device - an OTA
# cannot change its own trust anchor. See tools/mcuboot/README.md.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_SIGNATURE_KEY_FILE=""
CONFIG_BOOT_ENCRYPT_IMAGE=n

# --- refuse older versions ----------------------------------------------------
# Mirrors CONFIG_MCUBOOT_BOOTLOADER_MODE_HAS_NO_DOWNGRADE on the application side
# and the version compare in hcp::ota, so a downgrade has to be a deliberate
# act. The rollback path is unaffected: reverting to the image that was running
# before is not treated as a downgrade.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# --- watchdog: an outer deadline the application is expected to replace -------
# MCUboot arms the SoC watchdog (the `watchdog0` alias, the same MWDT0 hcp::ota
# uses) before jumping to the application, and feeds it through its own work -
# moving a megabyte takes ~75 s here, longer than any reasonable deadline.
#
# The application's first act is then either to re-arm a much tighter window (this
# boot is an unconfirmed trial image: prove itself or the chip resets and the old
# firmware comes back) or to cancel the deadline (this boot is final). So the
# bootloader's timeout is only the net under an image that never reaches main().
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_SETUP_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_INSTALL_TIMEOUT_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=600000
CONFIG_BOOT_WATCHDOG_FEED=y
# (BOOT_WATCHDOG_FEED without SETUP_AT_BOOT does not even compile: watchdog.c's
# feed path uses a channel id that is only declared when a timeout is installed.)

# --- size ---------------------------------------------------------------------
# The bootloader has to fit its own partition (64 K on C3/C6, 56 K on C5); the
# link fails loudly if it does not, which is the point of pinning this here.
# Logging is left to boot/zephyr/socs/<soc>.conf, which silences it for Espressif
# targets: setting CONFIG_LOG=n here would fight that fragment's own log options
# and Kconfig turns the resulting mismatch into a build error.
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
