# Opt-in fragment for the WS2812 addressable-LED feature (arch-neutral, code
# side). Pair it with the per-board DT overlay at
#   boards/helios/<board>/<board>-ws2812.overlay
# Enable a build with BOTH (build.sh --led does this for you):
#   -DEXTRA_CONF_FILE=lib/led/ws2812-spi.conf
#   -DEXTRA_DTC_OVERLAY_FILE=boards/helios/<board>/<board>-ws2812.overlay
# Without them the feature is completely absent (base app unaffected).
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_HCP_LED=y
CONFIG_HCP_LED_BACKEND_ZEPHYR=y
