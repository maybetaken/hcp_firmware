# Opt-in fragment for the WS2812 addressable-LED feature (pair with
# ws2812-spi.overlay). Enable a build with BOTH:
#   -DEXTRA_CONF_FILE=lib/led/ws2812-spi.conf
#   -DEXTRA_DTC_OVERLAY_FILE=lib/led/ws2812-spi.overlay
# Without them the feature is completely absent (base app unaffected).
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_HCP_LED=y
CONFIG_HCP_LED_BACKEND_ZEPHYR=y
