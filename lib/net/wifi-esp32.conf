# esp32 Wi-Fi runtime essentials for HCP (mirrors Zephyr's / Shawn Hymel's
# working esp32 Wi-Fi recipe). Apply alongside CONFIG_HCP_NET for real AP tests:
#   -DEXTRA_CONF_FILE=lib/net/wifi-esp32.conf,<creds.conf>
# esp_wifi needs a large system heap, or association flakes (auth failures).
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
CONFIG_HEAP_MEM_POOL_SIZE=51200
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
# esp_wifi runs DHCP itself; the stack reports the address via ADDR_ADD
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_LOG=y
