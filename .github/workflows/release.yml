#
# Pushing a v<version> tag publishes the release.
#
# The rule this enforces is the project's own: a version number is only a release when it
# has a tag AND a CHANGELOG.md section, and tools/release.sh is what creates the tag after
# checking exactly that. So by the time this workflow runs, the notes already exist - the
# job's work is to assemble them (tools/release_notes.sh: the CHANGELOG section, the commit
# list since the previous tag, and any new contributor), build the images, and put them on
# the release page.
#
# Two optional inputs, both set as repository-level configuration:
#
#   vars.HCP_CI_IMAGE      the env-zephyr-espressif build image (see ci.yml for why it has
#                          to come from a registry: Dockerfile.espressif lives in the
#                          environment repository, not this one). Unset -> the release is
#                          still published, with the notes and no binaries.
#   secrets.HCP_SIGN_KEY   the MCUboot signing key, PEM text. keys/ is gitignored on
#                          purpose, so without this the boards are built unsigned and
#                          cannot be installed by a signed bootloader - which the job says
#                          in the release body instead of hiding.
#
# And one optional notification:
#
#   secrets.HCP_NOTIFY_URL a webhook to POST a one-line summary to after the release is
#                          created. Unset -> skipped.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are generated from history since the previous tag, and the
          # contributor list from everything before it - neither works on a shallow clone.
          fetch-depth: 0

      - name: version
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=${tag#v}" >> "$GITHUB_ENV"

      - name: check the release rule holds (version, CHANGELOG, tag)
        run: |
          python3 tools/check_release.py
          python3 tools/check_licence.py
          grep -qE "^## ${version}\b" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${version}' section, so this tag names a"
            echo "           rebuild rather than a release. Cut it with ./tools/release.sh."
            exit 1; }

      - name: build the images for every board
        if: ${{ vars.HCP_CI_IMAGE != '' }}
        env:
          HCP_CI_IMAGE: ${{ vars.HCP_CI_IMAGE }}
          HCP_SIGN_KEY: ${{ secrets.HCP_SIGN_KEY }}
        run: |
          mkdir -p keys
          if [ -n "$HCP_SIGN_KEY" ]; then
            printf '%s\n' "$HCP_SIGN_KEY" > keys/root-ec256.pem
            signed="--signed"
            echo "signing the images with root-ec256"
          else
            signed=""
            echo "no HCP_SIGN_KEY secret: building UNSIGNED images, which a signed "
            echo "MCUboot on a device will refuse. The release will still be published, "
            echo "with this stated in its notes rather than left to be discovered."
          fi
          for b in hcp_c3 hcp_c5/esp32c5/hpcore hcp_c6/esp32c6/hpcore; do
            ./build.sh "$b" $signed --version "$version" 2>&1 | tail -2
          done
          for b in hcp_c3 hcp_c5_esp32c5_hpcore hcp_c6_esp32c6_hpcore; do
            d=$(ls -d "build/${b}_v${version}"* 2>/dev/null | head -1)
            [ -n "$d" ] && [ -f "$d/zephyr/zephyr.signed.bin" ] &&
              cp "$d/zephyr/zephyr.signed.bin" "${b}-${version}.bin"
          done
          ls -l *.bin

      - name: release notes
        run: ./tools/release_notes.sh "$tag" > notes.md

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" --title "$tag" --notes-file notes.md --latest
          for f in *.bin; do [ -e "$f" ] && gh release upload "$tag" "$f" --clobber; done
          gh release view "$tag" --json tagName,url,assets -q '.tagName + "  " + .url'

      - name: announce it
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_URL: ${{ secrets.HCP_NOTIFY_URL }}
        run: |
          # Unset by default: a release that cannot reach a chat webhook is still a release.
          if [ -z "$NOTIFY_URL" ]; then
            echo "HCP_NOTIFY_URL is not set - skipping the announcement"
            exit 0
          fi
          url=$(gh release view "$tag" --json url -q .url)
          curl -sf -X POST "$NOTIFY_URL" -H 'Content-Type: application/json' \
            -d "{\"text\":\"HCP $tag published: $url\"}"
        continue-on-error: true
