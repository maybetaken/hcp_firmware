CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_BOOT_BANNER=y
# Zephyr LOG subsystem (hcp::log zephyr backend routes through it)
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
# Buffered (deferred) logging, deliberately NOT CONFIG_LOG_MODE_IMMEDIATE: the
# console is USB-Serial-JTAG, whose host may simply stop reading (laptop asleep,
# terminal closed, or a stale handle after the device re-enumerates). With
# immediate mode the log call writes synchronously, so once the TX ring fills
# *whichever thread logged* blocks there - the product keeps running (link up, LED
# green) while no log line can ever appear again. In buffered mode a full ring just
# drops messages (logged with a counter) and no business thread is ever stalled by
# the debug port. Immediate mode also formatted on the caller's stack, which is what
# forced the oversized BT RX stack below.
# The log buffer is 2048 B on the C6 and C3 (see LOG_BUFFER_SIZE in the application
# Kconfig, which says what the 1024 B default cost us) and left at Zephyr's default
# on the ESP32-C5, where the extra kilobyte does not fit: raising it there overflowed
# SRAM, the binding target for memory on that board.
# Device-domain INFO. It used to be 4 (debug) purely so the "alive, uptime" line
# was visible by default; that line is debug-level now (the P0 self-test that came
# with it is gone), so raising the whole domain back to debug for it would only
# flood every other device message. For a bench session: -- -DCONFIG_HCP_LOG_LEVEL_DEVICE=4
CONFIG_HCP_LOG_LEVEL_DEVICE=3
# C++ runtime (operator new/delete used by hcp::kernel backends)
CONFIG_CPP=y
# ESP HAL drivers (spi_flash, intc_esp32) and esp_wifi (CONFIG_ESP_WIFI_HEAP_SYSTEM)
# use the kernel heap; esp_wifi needs a large pool or association/DHCP get flaky.
CONFIG_HEAP_MEM_POOL_SIZE=51200
# hcp::kernel's static thread pool. 8 slots (8 x 2 KB stacks + thread objects,
# ~20 KB of SRAM) was never used: a normal build runs the producer only, the LED
# demo is off while hcp::provision owns the strip, and modbus/net are demo-gated.
# The ESP32-C5 hpcore image did not fit in SRAM once TCP + IGMP were added, so the
# pool is sized to what the product actually starts; raise it if a build enables
# several workers at once.
CONFIG_HCP_KERNEL_MAX_THREADS=4
# esp_wifi should allocate from the system heap above (choice symbol, set here)
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
# Wi-Fi / net stack sizing
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
# A Wi-Fi scan emits one net_mgmt event per AP.  The default queue (5) drops
# results when the phone is connected over BLE and several APs are found.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
# Device name on the LAN. hcp::identity owns the real value: it resolves the
# serial number (storage "dev/snr", else the station MAC) and pushes it through
# net_hostname_set(), so the router's client list shows exactly the string the
# MQTT topics start with - without NET_HOSTNAME_ENABLE the DHCPv4 client sends no
# option 12 and every unit looks like its MAC vendor ("Espressif"). The module
# selects NET_HOSTNAME_ENABLE/DYNAMIC itself; what is set here is the name used
# until identity::Init() runs - the "hcp-" prefix plus the STA MAC in lowercase
# hex (NET_HOSTNAME_UNIQUE appends it at interface init), which for a MAC-derived
# serial already is the final answer.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="hcp-"
CONFIG_NET_HOSTNAME_UNIQUE=y
# BLE (BluFi): LOG_MODE_IMMEDIATE formats every log line on the calling thread.
# GATT service discovery runs on the BT RX thread; the 1200-byte default stack
# overflows there (illegal-instruction crash in cbvprintf on the first client
# Read By Group Type). Size it like the other threaded stacks above.
CONFIG_BT_RX_STACK_SIZE=4096
# BLE (BluFi): the stack defaults are tuned for tiny 23-byte packets. BluFi
# control/data frames (wifi list, encrypted ssid/password) are far larger, so a
# bt_gatt_notify() of >20B payload fails with -ENOMEM. Raise the ATT/L2CAP MTU and
# the ACL buffer size so notifications up to a full BluFi frame (~259B) fit; the
# EspBlufi app requests MTU 517 after connecting, so accept that here.
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# BLE (BluFi) TX power. Zephyr's BT_CTLR_TX_PWR choice defaults to 0 dBm and nobody
# raised it, so the C6 controller (components/bt/include/esp32c6/esp_bt.h maps
# CONFIG_BT_CTLR_TX_PWR_* -> ESP32_BT_CTRL_DFT_TX_POWER_LEVEL_EFF -> BLE_LL_TX_PWR_DBM_N)
# advertised ~9 dB below what an ESP-IDF build does - that is the "weak signal /
# dropped notifications" symptom. Choice symbol, so it must be assigned here, not
# selected. +9 dBm is the ESP-IDF-era default and well inside the module's range
# (it supports up to +21); re-check current consumption if this board gets battery-
# powered OTA.
CONFIG_BT_CTLR_TX_PWR_PLUS_9=y
# BluFi (ESP-compatible BLE provisioning): part of the product, so on by default
# for every board. Selects BT/BT_PERIPHERAL/BT_DRIVERS/BT_ESP32 (see
# modules/lib/blufi/Kconfig). Encrypted provisioning is implemented but stays
# off by default (CONFIG_BLUFI_SECURITY=n): plaintext works with both the WeChat
# mini-program and the Espressif apps, and enabling it links a vendored
# mbedtls-2.4 DHM/bignum/AES/MD5 (~15 KB).
CONFIG_BLUFI=y
# EspBlufi / ESP-Config filter discovered devices by a BLUFI-prefixed name.
CONFIG_BT_DEVICE_NAME="BLUFI_DEVICE"
# BluFi advertises from a fresh random-static identity each boot (blufi_start calls
# bt_id_create) so the phone does not reuse a cached per-address provisioning state.
# Zephyr's default BT_ID_MAX=1 leaves only BT_ID_DEFAULT, so bt_id_create returned
# -ENOMEM (-12) and the code silently fell back to the fixed public address - the
# whole point was lost. Keep one spare slot for it.
CONFIG_BT_ID_MAX=2

# Persistent KV storage for Wi-Fi credentials (hcp::storage -> Zephyr settings ->
# NVS on the DT-chosen "storage" partition). Without these the module falls back to
# the POSIX backend and nothing survives a reboot.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_HCP_STORAGE=y
CONFIG_HCP_STORAGE_BACKEND_ZEPHYR=y
# A WPA2 passphrase is up to 63 characters; the default 64 leaves no room for the
# terminating NUL in the cached value.
CONFIG_HCP_STORAGE_MAX_VALUE=96

# MQTT service session (lib/mqtt, on Zephyr's own MQTT library). It brings the
# status LED from violet (Wi-Fi only) to green (broker session up).
# Credentials are compiled in deliberately: the account is created by the user on
# their own broker, so it is not provisioned over the air. The broker address is
# NOT - hcp::ssdp picks it up from Home Assistant's announcement
# ("maybetaken: mqtt://<host>" on 239.255.255.250:1900) and hands it over; setting
# CONFIG_HCP_MQTT_HOST below is only a manual fallback.
CONFIG_HCP_MQTT_USER="maybetaken"
CONFIG_HCP_MQTT_PASS="maybetaken"
#CONFIG_HCP_MQTT_HOST="192.168.31.100"
#CONFIG_HCP_MQTT_PORT=1883
# Topics are prefixed with the device serial number (derived from the station MAC
# on first boot, kept in storage): "<sn>/online", "<sn>/state", "<sn>/cmd".
#CONFIG_HCP_MQTT_TOPIC_ONLINE="online"
#CONFIG_HCP_MQTT_FW_VERSION="0.1.0"

# Modbus: hcp::modbus, whose default backend is hcp's own RTU frame engine over
# hcp::serial::Port (see lib/modbus/Kconfig and include/hcp/modbus/rtu.h for why). No
# third-party stack is involved either way. The subsys backend, if chosen, requires
# its node role to be chosen, and a
# Kconfig choice cannot be `select`ed from another symbol, so a subsys build has to
# assign it here: CONFIG_MODBUS_ROLE_CLIENT=y.
# The default backend (hcp's own RTU engine, see lib/modbus/Kconfig) does not need
# it and does not build the subsys at all. Everything else about the port is
# devicetree: the `zephyr,modbus-serial` child of uart1 in
# boards/helios/common/hcp_base.dtsi, with de-gpios added by each board's
# *-rs485.overlay for the RS485 variant.
# The subsys' serial path runs on the UART interrupt API (modbus_serial.c calls
# uart_irq_callback_user_data_set()), and uart_esp32.c compiles its whole IRQ block
# - irq_callback_set included - under CONFIG_UART_INTERRUPT_DRIVEN. hcp::serial polls
# the UART, so this symbol was never on before and modbus_init_client() failed with
# -EINVAL on target.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Firmware update: hcp::ota on the reusable ota_client module. Nothing to set here -
# CONFIG_HCP_OTA (see lib/ota/Kconfig) defaults to on, selects CONFIG_OTA_CLIENT, and
# the sink selects BOOTLOADER_MCUBOOT + MCUBOOT_IMG_MANAGER, which moves the
# application into image-0 at 0x20000 and makes MCUboot (flashed at 0x0) the thing
# that boots it. See tools/mcuboot/mcuboot.conf for the bootloader's side of the
# layout and tools/mcuboot/README.md for how to build, flash and test it.
# Trial swap is the rule: hcp::ota confirms a new image only once it has a live
# broker session, so firmware that cannot reach the network rolls back.
# (ESP32-C5 is the exception: MCUboot mode overflows its SRAM by 8.6 KB measured
# before hcp::ota is even included, so HCP_OTA defaults to n there.)
# The endpoints Home Assistant serves on the discovered host:
#CONFIG_HCP_OTA_VERSION_URL="http://%s:9998/version.txt"
#CONFIG_HCP_OTA_IMAGE_URL="http://%s:9998/firmware.bin"
# The version of this build, in the two places it is read: CONFIG_APP_VERSION is
# what hcp::ota compares against the server's version.txt, and
# CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION is what imgtool stamps into the MCUboot image
# header - which is what MCUboot's own downgrade prevention compares. Leaving the
# second at Zephyr's default 0.0.0+0 would make that check meaningless, so both are
# set here, and "./build.sh <board> --version 2.0.3.15" overrides the pair together
# when an update image is produced.
#
# They are NOT the same spelling, and that is imgtool's limit rather than a choice:
# imgtool accepts maj.min.rev with an optional "+build" (verified against this
# MCUboot - scripts/imgtool/version.py), so the dotted fourth field the application
# reports has to arrive as a '+' for the image header. build.sh does that
# translation; keep it that way if you edit these lines by hand.
CONFIG_APP_VERSION="2.0.3.21"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="2.0.3+21"
