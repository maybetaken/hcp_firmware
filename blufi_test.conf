# BluFi bring-up overlay config: pass with
#   west build ... -- -- -DEXTRA_CONF_FILE=blufi_test.conf
# BT/BT_PERIPHERAL/BT_ESP32 etc. are pulled in by CONFIG_BLUFI's `select` chain
# in modules/lib/blufi/Kconfig.
CONFIG_BLUFI=y
CONFIG_BT_DEVICE_NAME="BLUFI_DEVICE"

# Encrypted provisioning (DH negotiation + AES-128-CFB128) is implemented but
# kept off by default: plaintext works end-to-end with both the WeChat
# mini-program and the Espressif apps, and the handshake pulls in a vendored
# mbedtls-2.4 (DHM/bignum/AES/MD5). Flip this to y to use it.
CONFIG_BLUFI_SECURITY=n
